<template>
    <!--
        manageAppointment — the Appointments tab.

        Nine sub-components, all template sections of this pather (Flow A), none
        of them a separate reusable child:
          page-header · appointment-list · appointment-row · row-actions ·
          empty-state · booking-form · slots-panel · error-message ·
          delete-confirm

        The list and the form are mutually exclusive; the list is the default.
    -->

    <!--
        Spinner at the ROOT template, never nested inside a positioned section —
        its fixed overlay (z-index 9999) would otherwise be trapped in that
        section's stacking context and hide behind the delete dialog.
    -->
    <template lwc:if={isLoading}>
        <c-ao-spinner overlay size="medium" alternative-text="Loading appointments..."></c-ao-spinner>
    </template>

    <div class="page-wrapper">

        <!-- ══ List view ═══════════════════════════════════════════════════ -->
        <template lwc:if={isListView}>

            <!-- page-header -->
            <div class="page-header">
                <h1 class="page-header__title">Appointments</h1>
                <c-ao-btn
                    label="New Appointment"
                    icon-name="utility:add"
                    variant="primary"
                    onclick={handleNewAppointmentClick}>
                </c-ao-btn>
            </div>

            <!-- appointment-list -->
            <section class="panel appointment-list">
                <template lwc:if={hasAppointments}>

                    <!--
                        Column headings. Hidden at narrow widths, where each row
                        stacks and carries its own labels instead.
                    -->
                    <div class="appointment-list__head">
                        <span class="appointment-list__heading">Date &amp; Time</span>
                        <span class="appointment-list__heading">Patient Name</span>
                        <span class="appointment-list__heading">Phone</span>
                        <span class="appointment-list__heading">Type</span>
                        <span class="appointment-list__heading">Location</span>
                        <span class="appointment-list__heading">Duration (min)</span>
                        <span class="appointment-list__heading">Fees</span>
                        <span class="appointment-list__heading">Actions</span>
                    </div>

                    <!-- appointment-row, one per appointment, in stored order -->
                    <template for:each={appointmentRows} for:item="row">
                        <div key={row.id} class="appointment-row">
                            <div class="appointment-row__cell">
                                <span class="appointment-row__label">Date &amp; Time</span>
                                <span class="appointment-row__value">{row.whenLabel}</span>
                            </div>
                            <div class="appointment-row__cell">
                                <span class="appointment-row__label">Patient Name</span>
                                <span class="appointment-row__value">{row.patientName}</span>
                            </div>
                            <div class="appointment-row__cell">
                                <span class="appointment-row__label">Phone</span>
                                <span class="appointment-row__value">{row.phone}</span>
                            </div>
                            <div class="appointment-row__cell">
                                <span class="appointment-row__label">Type</span>
                                <span class="appointment-row__value">{row.appointmentType}</span>
                            </div>
                            <div class="appointment-row__cell">
                                <span class="appointment-row__label">Location</span>
                                <span class="appointment-row__value">{row.location}</span>
                            </div>
                            <div class="appointment-row__cell">
                                <span class="appointment-row__label">Duration (min)</span>
                                <span class="appointment-row__value">{row.durationLabel}</span>
                            </div>
                            <div class="appointment-row__cell">
                                <span class="appointment-row__label">Fees</span>
                                <span class="appointment-row__value">{row.feesLabel}</span>
                            </div>

                            <!-- row-actions -->
                            <div class="appointment-row__cell">
                                <span class="appointment-row__label">Actions</span>
                                <div class="row-actions">
                                    <c-ao-btn
                                        label="Edit"
                                        variant="secondary"
                                        size="sm"
                                        data-id={row.id}
                                        onclick={handleEditClick}>
                                    </c-ao-btn>
                                    <c-ao-btn
                                        label="Delete"
                                        variant="danger"
                                        size="sm"
                                        data-id={row.id}
                                        onclick={handleDeleteClick}>
                                    </c-ao-btn>
                                </div>
                            </div>
                        </div>
                    </template>
                </template>

                <!-- empty-state -->
                <template lwc:else>
                    <div class="empty-state">
                        <p class="empty-state__msg">No appointments scheduled yet.</p>
                        <a
                            href="#"
                            class="empty-state__link"
                            onclick={handleCreateFromEmptyState}>Create one now.</a>
                    </div>
                </template>
            </section>
        </template>

        <!-- ══ Booking form view ═══════════════════════════════════════════ -->
        <template lwc:else>
            <section class="panel booking-form">
                <h2 class="panel__title">{formTitle}</h2>

                <!--
                    error-message + slots-panel.

                    Every other failure in this component goes to a toast. This
                    one surface is inline because it is not just a message: it
                    carries the offered slots the admin has to read while editing
                    the Date & Time field beside it, and it is dismissible on its
                    own (the booking was already rejected — dismissing changes
                    nothing about it).
                -->
                <template lwc:if={hasAvailabilityMessage}>
                    <div class="error-message" role="alert">
                        <div class="error-message__head">
                            <span class="error-message__text">{availabilityMessage}</span>
                            <c-ao-btn
                                icon-name="utility:close"
                                variant="bare"
                                size="sm"
                                title="Dismiss"
                                onclick={handleAvailabilityDismiss}>
                            </c-ao-btn>
                        </div>

                        <template lwc:if={hasAvailableSlots}>
                            <ul class="slots-panel">
                                <template for:each={slotRows} for:item="slot">
                                    <li key={slot.key} class="slots-panel__slot">{slot.label}</li>
                                </template>
                            </ul>
                        </template>
                    </div>
                </template>

                <div class="booking-form__grid">
                    <!--
                        Date & Time as two native pickers — a calendar picker and
                        a time picker. Read-only on an edit: an appointment's date
                        and time are fixed once it is booked.
                    -->
                    <c-ao-input
                        label="Date"
                        type="date"
                        required
                        readonly={isMomentReadOnly}
                        value={form.appointmentDate}
                        data-field="appointmentDate"
                        onchange={handleFormFieldChange}>
                    </c-ao-input>

                    <c-ao-input
                        label="Time"
                        type="time"
                        required
                        readonly={isMomentReadOnly}
                        value={form.appointmentTime}
                        data-field="appointmentTime"
                        onchange={handleFormFieldChange}>
                    </c-ao-input>

                    <c-ao-input
                        label="First Name"
                        type="text"
                        required
                        value={form.firstName}
                        data-field="firstName"
                        onchange={handleFormFieldChange}>
                    </c-ao-input>

                    <c-ao-input
                        label="Last Name"
                        type="text"
                        required
                        value={form.lastName}
                        data-field="lastName"
                        onchange={handleFormFieldChange}>
                    </c-ao-input>

                    <c-ao-input
                        label="Phone Number"
                        type="text"
                        required
                        placeholder="+961 71123456"
                        value={form.phoneNumber}
                        data-field="phoneNumber"
                        onchange={handleFormFieldChange}>
                    </c-ao-input>

                    <c-ao-input
                        label="Phone Number 2"
                        type="text"
                        placeholder="Alternative contact"
                        value={form.phoneNumber2}
                        data-field="phoneNumber2"
                        onchange={handleFormFieldChange}>
                    </c-ao-input>

                    <c-ao-input
                        label="Type"
                        type="text"
                        required
                        value={form.appointmentType}
                        data-field="appointmentType"
                        onchange={handleFormFieldChange}>
                    </c-ao-input>

                    <c-ao-input
                        label="Duration (min)"
                        type="number"
                        required
                        min="1"
                        step="1"
                        value={form.durationMinutes}
                        data-field="durationMinutes"
                        onchange={handleFormFieldChange}>
                    </c-ao-input>

                    <c-ao-input
                        label="Fees"
                        type="number"
                        required
                        min="0"
                        step="0.01"
                        value={form.fees}
                        data-field="fees"
                        onchange={handleFormFieldChange}>
                    </c-ao-input>

                    <!--
                        Location and Notes are LongTextArea(500) fields. No row in
                        ao-reusable-components-guide covers a multi-line textarea,
                        so the markup is hand-rolled per that guide's rule 2 —
                        never by creating a new ao* component mid-feature.
                    -->
                    <div class="booking-form__field booking-form__field--wide">
                        <span class="booking-form__label">
                            Location<span class="booking-form__required" aria-hidden="true"> *</span>
                        </span>
                        <!--
                            A native textarea takes its value as text content,
                            not as a `value` attribute, and it commits on
                            `change` (focusout) rather than per keystroke — so
                            the re-render never lands while the caret is in it.
                        -->
                        <textarea
                            class="booking-form__textarea"
                            rows="3"
                            maxlength="500"
                            aria-label="Location"
                            data-field="location"
                            onchange={handleFormTextAreaChange}>{form.location}</textarea>
                    </div>

                    <div class="booking-form__field booking-form__field--wide">
                        <span class="booking-form__label">Notes</span>
                        <textarea
                            class="booking-form__textarea"
                            rows="3"
                            maxlength="500"
                            aria-label="Notes"
                            data-field="notes"
                            onchange={handleFormTextAreaChange}>{form.notes}</textarea>
                    </div>
                </div>

                <div class="booking-form__footer">
                    <c-ao-btn
                        label="Cancel"
                        variant="ghost"
                        onclick={handleFormCancel}>
                    </c-ao-btn>
                    <c-ao-btn
                        label={submitLabel}
                        variant="primary"
                        onclick={handleBookAppointment}>
                    </c-ao-btn>
                </div>
            </section>
        </template>
    </div>

    <!-- ══ delete-confirm ══════════════════════════════════════════════════ -->
    <template lwc:if={showDeleteConfirm}>
        <div class="modal-backdrop"></div>
        <div class="modal modal--sm delete-confirm" role="dialog" aria-modal="true"
             aria-label="Delete appointment">
            <div class="modal__header delete-confirm__header">
                <h2 class="modal__title">Delete appointment</h2>
                <c-ao-btn
                    icon-name="utility:close"
                    variant="bare"
                    size="sm"
                    title="Close"
                    onclick={handleDeleteCancel}>
                </c-ao-btn>
            </div>
            <div class="modal__content">
                <p class="delete-confirm__question">
                    Are you sure you want to delete this appointment?
                </p>
                <p class="delete-confirm__countdown">{deleteCountdownLabel}</p>
            </div>
            <div class="modal__footer">
                <c-ao-btn
                    label="Delete"
                    variant="danger"
                    onclick={handleDeleteConfirm}>
                </c-ao-btn>
            </div>
        </div>
    </template>
</template>
