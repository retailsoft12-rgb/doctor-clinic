<template>
    <div class="page">
        <!--
            Loading overlay. Hand-rolled rather than <c-ao-spinner overlay>:
            the ao* catalog lists that component but it is not on disk, and the
            catalog's own rule is to hand-roll a missing entry, never create it.
            Kept at the root template so its fixed backdrop is not trapped in a
            section's stacking context.
        -->
        <template lwc:if={isLoading}>
            <div class="overlay" role="status" aria-live="polite">
                <div class="overlay__spinner"></div>
                <span class="overlay__text">Loading...</span>
            </div>
        </template>

        <!-- ── The appointment list ─────────────────────────────────────────── -->
        <template lwc:if={isListView}>
            <header class="page__header">
                <h1 class="page__title">Appointments</h1>
                <div class="page__actions">
                    <button class="btn btn--primary" type="button" onclick={handleNewAppointmentClick}>
                        New Appointment
                    </button>
                    <button
                        class="btn btn--ghost btn--icon"
                        type="button"
                        title="AI Schedule Assistant"
                        onclick={handleAssistantOpen}
                    >
                        <span class="face face--smile" aria-hidden="true"></span>
                        <span class="assistive">Open the AI Schedule Assistant</span>
                    </button>
                </div>
            </header>

            <!-- Stays on the page until the next successful load. -->
            <template lwc:if={hasListError}>
                <div class="error-box" role="alert">{listErrorMessage}</div>
            </template>

            <template lwc:if={hasAppointments}>
                <section class="panel">
                    <div class="table" role="table">
                        <div class="table__head" role="row">
                            <span class="table__cell table__cell--head" role="columnheader">Date &amp; Time</span>
                            <span class="table__cell table__cell--head" role="columnheader">Patient Name</span>
                            <span class="table__cell table__cell--head" role="columnheader">Phone</span>
                            <span class="table__cell table__cell--head" role="columnheader">Type</span>
                            <span class="table__cell table__cell--head" role="columnheader">Location</span>
                            <span class="table__cell table__cell--head" role="columnheader">Duration (min)</span>
                            <span class="table__cell table__cell--head" role="columnheader">Fees</span>
                            <span class="table__cell table__cell--head" role="columnheader">Actions</span>
                        </div>

                        <template for:each={scheduleRows} for:item="row">
                            <div class="table__row" key={row.id} role="row">
                                <span class="table__cell" data-label="Date & Time" role="cell">{row.when}</span>
                                <span class="table__cell" data-label="Patient Name" role="cell">{row.patient}</span>
                                <span class="table__cell" data-label="Phone" role="cell">{row.phone}</span>
                                <span class="table__cell" data-label="Type" role="cell">{row.type}</span>
                                <span class="table__cell" data-label="Location" role="cell">{row.location}</span>
                                <span class="table__cell" data-label="Duration (min)" role="cell">{row.duration}</span>
                                <span class="table__cell" data-label="Fees" role="cell">{row.fees}</span>
                                <span class="table__cell table__cell--actions" data-label="Actions" role="cell">
                                    <template lwc:if={row.isPendingDelete}>
                                        <div class="confirm">
                                            <span class="confirm__text">
                                                Are you sure you want to delete this appointment?
                                            </span>
                                            <button
                                                class="confirm__link"
                                                type="button"
                                                data-id={row.id}
                                                onclick={handleDeleteConfirm}
                                            >
                                                Delete
                                            </button>
                                            <button
                                                class="confirm__close"
                                                type="button"
                                                title="Cancel"
                                                onclick={handleDeleteCancel}
                                            >
                                                &times;
                                            </button>
                                        </div>
                                    </template>
                                    <template lwc:else>
                                        <button class="btn btn--ghost btn--sm" type="button" onclick={handleEditClick}>
                                            Edit
                                        </button>
                                        <button
                                            class="btn btn--danger btn--sm"
                                            type="button"
                                            data-id={row.id}
                                            onclick={handleDeleteRequest}
                                        >
                                            Delete
                                        </button>
                                    </template>
                                </span>
                            </div>
                        </template>
                    </div>
                </section>
            </template>

            <template lwc:else>
                <!-- A clinic with no appointments is a normal state, not an error. -->
                <div class="empty-msg">
                    <p class="empty-msg__text">No appointments scheduled yet.</p>
                    <button class="empty-msg__link" type="button" onclick={handleCreateOneNowClick}>
                        Create one now.
                    </button>
                </div>
            </template>
        </template>

        <!-- ── The booking form ─────────────────────────────────────────────── -->
        <template lwc:elseif={isFormView}>
            <section class="panel">
                <h2 class="panel__title">Create Appointment</h2>

                <!-- One "Server Error" panel is ever on screen; a new attempt replaces it. -->
                <template lwc:if={hasErrorPanel}>
                    <div class="server-error" role="alert">
                        <div class="server-error__head">
                            <span class="server-error__title">Server Error</span>
                            <button
                                class="server-error__close"
                                type="button"
                                title="Dismiss"
                                onclick={handleErrorPanelClose}
                            >
                                &times;
                            </button>
                        </div>
                        <p class="server-error__message">{errorPanel.message}</p>

                        <template lwc:if={errorPanel.hasErrors}>
                            <ul class="server-error__list">
                                <template for:each={errorPanel.errors} for:item="fieldError">
                                    <li class="server-error__item" key={fieldError}>{fieldError}</li>
                                </template>
                            </ul>
                        </template>

                        <template lwc:if={errorPanel.hasSlots}>
                            <ul class="server-error__list">
                                <template for:each={errorPanel.slots} for:item="slot">
                                    <li class="server-error__item" key={slot.key}>{slot.label}</li>
                                </template>
                            </ul>
                        </template>
                    </div>
                </template>

                <div class="form">
                    <label class="field">
                        <span class="field__label">Date &amp; Time</span>
                        <input
                            class="field__input"
                            type="datetime-local"
                            data-field="startDateTime"
                            value={form.startDateTime}
                            onchange={handleFormFieldChange}
                            required
                        />
                    </label>

                    <label class="field">
                        <span class="field__label">First Name</span>
                        <input
                            class="field__input"
                            type="text"
                            maxlength="50"
                            data-field="firstName"
                            value={form.firstName}
                            onchange={handleFormFieldChange}
                            required
                        />
                    </label>

                    <label class="field">
                        <span class="field__label">Last Name</span>
                        <input
                            class="field__input"
                            type="text"
                            maxlength="50"
                            data-field="lastName"
                            value={form.lastName}
                            onchange={handleFormFieldChange}
                            required
                        />
                    </label>

                    <label class="field">
                        <span class="field__label">Phone Number</span>
                        <input
                            class="field__input"
                            type="tel"
                            data-field="phoneNumber"
                            value={form.phoneNumber}
                            onchange={handleFormFieldChange}
                            required
                        />
                    </label>

                    <label class="field">
                        <span class="field__label">Phone Number 2</span>
                        <input
                            class="field__input"
                            type="tel"
                            data-field="phoneNumber2"
                            value={form.phoneNumber2}
                            onchange={handleFormFieldChange}
                        />
                    </label>

                    <label class="field">
                        <span class="field__label">Type</span>
                        <input
                            class="field__input"
                            type="text"
                            placeholder="Consultation, Check-up, ..."
                            data-field="appointmentType"
                            value={form.appointmentType}
                            onchange={handleFormFieldChange}
                            required
                        />
                    </label>

                    <label class="field">
                        <span class="field__label">Duration (min)</span>
                        <input
                            class="field__input"
                            type="number"
                            min="1"
                            step="1"
                            data-field="durationMinutes"
                            value={form.durationMinutes}
                            onchange={handleFormFieldChange}
                            required
                        />
                    </label>

                    <label class="field">
                        <span class="field__label">Fees</span>
                        <input
                            class="field__input"
                            type="number"
                            min="0"
                            step="0.01"
                            data-field="fees"
                            value={form.fees}
                            onchange={handleFormFieldChange}
                            required
                        />
                    </label>

                    <label class="field field--wide">
                        <span class="field__label">Location</span>
                        <input
                            class="field__input"
                            type="text"
                            maxlength="500"
                            data-field="location"
                            value={form.location}
                            onchange={handleFormFieldChange}
                            required
                        />
                    </label>

                    <label class="field field--wide">
                        <span class="field__label">Notes</span>
                        <!-- textarea takes its value as content, not as an attribute -->
                        <textarea
                            class="field__input field__input--area"
                            maxlength="500"
                            data-field="notes"
                            onchange={handleFormFieldChange}
                        >{form.notes}</textarea>
                    </label>
                </div>

                <div class="form__actions">
                    <button class="btn btn--primary" type="button" onclick={handleBookAppointment}>
                        Book appointment
                    </button>
                    <button class="btn btn--ghost" type="button" onclick={handleCancelBooking}>Cancel</button>
                </div>
            </section>
        </template>

        <!-- ── The AI schedule assistant ────────────────────────────────────── -->
        <template lwc:elseif={isAssistantView}>
            <section class="panel">
                <header class="assistant__head">
                    <h2 class="panel__title">AI Schedule Assistant</h2>
                    <button class="assistant__back" type="button" onclick={handleBackToAppointments}>
                        Back to Appointments
                    </button>
                </header>

                <div class="chat">
                    <div class="chat__row chat__row--assistant">
                        <p class="chat__bubble chat__bubble--assistant">{greeting}</p>
                    </div>

                    <template lwc:if={exchange}>
                        <div class="chat__row chat__row--user">
                            <p class="chat__bubble chat__bubble--user">{exchange.userText}</p>
                        </div>
                        <div class="chat__row chat__row--assistant">
                            <p class="chat__bubble chat__bubble--assistant">{exchange.assistantText}</p>
                        </div>
                    </template>
                </div>

                <template lwc:if={hasAiResponse}>
                    <div class="ai-response">
                        <span class="ai-response__label">AI Response</span>
                        <p class="ai-response__text">{aiResponse}</p>
                    </div>
                </template>

                <div class="composer">
                    <input
                        class="field__input composer__input"
                        type="text"
                        placeholder="Type your message here..."
                        value={draftMessage}
                        onchange={handleMessageChange}
                        oninput={handleMessageChange}
                    />
                    <button
                        class="btn btn--primary"
                        type="button"
                        disabled={sendDisabled}
                        onclick={handleSendMessage}
                    >
                        Send
                    </button>
                    <button
                        class="btn btn--ghost btn--icon"
                        type="button"
                        title="Record a voice message"
                        onclick={handleVoicePanelOpen}
                    >
                        &#127908;
                        <span class="assistive">Record a voice message</span>
                    </button>
                </div>
            </section>

            <!-- Voice recording panel — a modal over the conversation. -->
            <template lwc:if={showVoicePanel}>
                <div class="modal-backdrop" onclick={handleVoicePanelClose}></div>
                <div class="modal modal--sm" role="dialog" aria-modal="true">
                    <div class="modal__header">
                        <h3 class="modal__title">Record Voice Message</h3>
                        <button
                            class="modal__close"
                            type="button"
                            title="Close"
                            onclick={handleVoicePanelClose}
                        >
                            &times;
                        </button>
                    </div>
                    <div class="modal__content">
                        <p class={voiceStatusClass}>{voiceStatus}</p>
                        <p class="voice__timer">{timerLabel}</p>

                        <template lwc:if={hasVoiceReply}>
                            <p class="voice__reply">{voiceReply}</p>
                        </template>
                        <template lwc:if={hasVoiceAudio}>
                            <audio class="voice__player" src={voiceAudioUrl} controls autoplay></audio>
                        </template>
                    </div>
                    <div class="modal__footer">
                        <button
                            class="btn btn--secondary"
                            type="button"
                            disabled={startDisabled}
                            onclick={handleRecordStart}
                        >
                            Start
                        </button>
                        <button
                            class="btn btn--secondary"
                            type="button"
                            disabled={stopDisabled}
                            onclick={handleRecordStop}
                        >
                            Stop
                        </button>
                        <button
                            class="btn btn--primary"
                            type="button"
                            disabled={sendVoiceDisabled}
                            onclick={handleRecordSend}
                        >
                            Send
                        </button>
                    </div>
                </div>
            </template>
        </template>

        <!-- The floating assistant face — on screen in all three views. -->
        <div class="floater">
            <template lwc:if={bubble}>
                <span class="floater__bubble">{bubble.text}</span>
            </template>
            <button
                class="floater__btn"
                type="button"
                title="Assistant"
                onclick={handleAssistantButtonClick}
            >
                <span class="face face--smile" aria-hidden="true"></span>
                <span class="assistive">Assistant</span>
            </button>
        </div>
    </div>
</template>
