<template>
    <div class="appt">

        <!-- ── Page Header ─────────────────────────────────────────────────── -->
        <header class="appt__header">
            <h1 class="appt__title">Appointments</h1>
            <template lwc:if={isListView}>
                <c-ao-btn
                    label="New Appointment"
                    icon-name="utility:add"
                    variant="primary"
                    onclick={handleNewAppointment}>
                </c-ao-btn>
            </template>
        </header>

        <!-- ── View 1 — Appointment List (default) ─────────────────────────── -->
        <template lwc:if={isListView}>
            <section class="appt__panel">

                <!-- Load failure — rendered above the list area, no rows shown -->
                <template lwc:if={hasListError}>
                    <p class="appt__error-box" role="alert">{listErrorMessage}</p>
                </template>

                <!-- Empty State -->
                <template lwc:if={isEmptyState}>
                    <div class="appt__empty">
                        <p class="appt__empty-text">No appointments scheduled yet.</p>
                        <button
                            class="appt__empty-link"
                            type="button"
                            onclick={handleNewAppointment}>Create one now.</button>
                    </div>
                </template>

                <!-- Appointment List -->
                <template lwc:if={showTable}>
                    <div class="appt__table-scroll">
                        <table class="appt__table">
                            <thead class="appt__thead">
                                <tr>
                                    <th class="appt__th" scope="col">Date &amp; Time</th>
                                    <th class="appt__th" scope="col">Patient Name</th>
                                    <th class="appt__th" scope="col">Phone</th>
                                    <th class="appt__th" scope="col">Type</th>
                                    <th class="appt__th" scope="col">Location</th>
                                    <th class="appt__th" scope="col">Duration (min)</th>
                                    <th class="appt__th" scope="col">Fees</th>
                                    <th class="appt__th" scope="col">Actions</th>
                                </tr>
                            </thead>
                            <tbody>
                                <!-- Appointment Row -->
                                <template for:each={scheduleRows} for:item="row">
                                    <tr class="appt__row" key={row.id}>
                                        <td class="appt__td" data-label="Date &amp; Time">
                                            <span class="appt__date">{row.dateLabel}</span>
                                            <span class="appt__time">{row.timeLabel}</span>
                                        </td>
                                        <td class="appt__td" data-label="Patient Name">{row.patientName}</td>
                                        <td class="appt__td" data-label="Phone">{row.phone}</td>
                                        <td class="appt__td" data-label="Type">{row.appointmentType}</td>
                                        <td class="appt__td" data-label="Location">{row.location}</td>
                                        <td class="appt__td" data-label="Duration (min)">{row.duration}</td>
                                        <td class="appt__td" data-label="Fees">{row.fees}</td>
                                        <td class="appt__td appt__td--actions" data-label="Actions">
                                            <div class="appt__actions">
                                                <c-ao-btn
                                                    icon-name="utility:edit"
                                                    variant="bare"
                                                    size="sm"
                                                    title="Edit"
                                                    onclick={handleEdit}>
                                                </c-ao-btn>
                                                <c-ao-btn
                                                    icon-name="utility:delete"
                                                    variant="bare"
                                                    size="sm"
                                                    title="Delete"
                                                    data-id={row.id}
                                                    onclick={handleDeleteRequest}>
                                                </c-ao-btn>
                                            </div>
                                        </td>
                                    </tr>
                                </template>
                            </tbody>
                        </table>
                    </div>
                </template>
            </section>
        </template>

        <!-- ── View 2 — Booking Form ───────────────────────────────────────── -->
        <template lwc:else>
            <section class="appt__panel">
                <h2 class="appt__panel-title">Create Appointment</h2>

                <!-- Error Panel — validation errors, offered slots, or a message -->
                <template lwc:if={hasServerError}>
                    <div class="appt__server-error" role="alert">
                        <div class="appt__server-error-head">
                            <span class="appt__server-error-title">Server Error</span>
                            <button
                                class="appt__server-error-close"
                                type="button"
                                title="Dismiss"
                                onclick={handleDismissError}>&times;</button>
                        </div>

                        <template lwc:if={serverErrorIsValidation}>
                            <p class="appt__server-error-lead">Validation errors</p>
                            <ul class="appt__server-error-list">
                                <template for:each={panelFieldErrors} for:item="fieldError">
                                    <li class="appt__server-error-item" key={fieldError.key}>
                                        <span class="appt__server-error-field">{fieldError.field}</span>
                                        <span class="appt__server-error-reason">{fieldError.message}</span>
                                    </li>
                                </template>
                            </ul>
                        </template>

                        <!-- Available Slots Panel -->
                        <template lwc:elseif={serverErrorIsSlots}>
                            <p class="appt__server-error-lead">{panelMessage}</p>
                            <ul class="appt__slots">
                                <template for:each={panelSlots} for:item="slot">
                                    <li class="appt__slot" key={slot.key}>{slot.label}</li>
                                </template>
                            </ul>
                        </template>

                        <template lwc:else>
                            <p class="appt__server-error-lead">{panelMessage}</p>
                        </template>
                    </div>
                </template>

                <div class="appt__form-grid">
                    <c-ao-input
                        label="Date"
                        type="date"
                        required
                        value={bookingForm.startDate}
                        data-field="startDate"
                        onchange={handleFieldChange}>
                    </c-ao-input>

                    <c-ao-input
                        label="Time"
                        type="time"
                        required
                        value={bookingForm.startTime}
                        data-field="startTime"
                        onchange={handleFieldChange}>
                    </c-ao-input>

                    <c-ao-input
                        label="First Name"
                        type="text"
                        required
                        value={bookingForm.firstName}
                        data-field="firstName"
                        onchange={handleFieldChange}>
                    </c-ao-input>

                    <c-ao-input
                        label="Last Name"
                        type="text"
                        required
                        value={bookingForm.lastName}
                        data-field="lastName"
                        onchange={handleFieldChange}>
                    </c-ao-input>

                    <c-ao-input
                        label="Phone Number"
                        type="text"
                        required
                        placeholder="+961 3123456"
                        value={bookingForm.phoneNumber}
                        data-field="phoneNumber"
                        onchange={handleFieldChange}>
                    </c-ao-input>

                    <c-ao-input
                        label="Phone Number 2"
                        type="text"
                        placeholder="Optional"
                        value={bookingForm.phoneNumber2}
                        data-field="phoneNumber2"
                        onchange={handleFieldChange}>
                    </c-ao-input>

                    <c-ao-input
                        label="Type"
                        type="text"
                        required
                        value={bookingForm.appointmentType}
                        data-field="appointmentType"
                        onchange={handleFieldChange}>
                    </c-ao-input>

                    <c-ao-input
                        label="Duration (min)"
                        type="number"
                        required
                        min="1"
                        step="1"
                        value={bookingForm.durationMinutes}
                        data-field="durationMinutes"
                        onchange={handleFieldChange}>
                    </c-ao-input>

                    <c-ao-input
                        label="Fees"
                        type="number"
                        required
                        min="0"
                        step="0.01"
                        value={bookingForm.fees}
                        data-field="fees"
                        onchange={handleFieldChange}>
                    </c-ao-input>
                </div>

                <!-- Location and Notes are LongTextArea on the object; no catalog
                     row covers a multi-line control, so these are hand-rolled.

                     They are intentionally left uncontrolled: a <textarea> holds its
                     value as text content, and rewriting that on every keystroke
                     would drag the caret to the end. The whole form section is
                     rebuilt each time the view opens, so it starts empty on its own,
                     and `oninput` keeps the draft in step. -->
                <div class="appt__field">
                    <span class="appt__field-label">
                        Location<span class="appt__field-required" aria-hidden="true"> *</span>
                    </span>
                    <textarea
                        class="appt__textarea"
                        rows="3"
                        maxlength="500"
                        aria-label="Location"
                        data-field="location"
                        oninput={handleFieldChange}></textarea>
                </div>

                <div class="appt__field">
                    <span class="appt__field-label">Notes</span>
                    <textarea
                        class="appt__textarea"
                        rows="3"
                        maxlength="500"
                        aria-label="Notes"
                        data-field="notes"
                        oninput={handleFieldChange}></textarea>
                </div>

                <div class="appt__form-actions">
                    <c-ao-btn
                        label="Cancel"
                        variant="ghost"
                        onclick={handleCancelForm}>
                    </c-ao-btn>
                    <c-ao-btn
                        label="Book appointment"
                        variant="primary"
                        onclick={handleBookAppointment}>
                    </c-ao-btn>
                </div>
            </section>
        </template>

        <!-- ── Edit notice — flow 11, disappears after ~3 seconds ──────────── -->
        <template lwc:if={showEditNotice}>
            <div class="appt__notice" role="status">Not Supported!! &#128542;</div>
        </template>
    </div>

    <!-- ── Delete Confirmation — root level so its fixed backdrop is not
         trapped in a section's stacking context ────────────────────────────── -->
    <template lwc:if={showDeleteConfirm}>
        <div class="appt-confirm__backdrop"></div>
        <div class="appt-confirm" role="alertdialog" aria-label="Confirm delete">
            <div class="appt-confirm__countdown">
                <span class="appt-confirm__countdown-bar"></span>
            </div>
            <div class="appt-confirm__body">
                <button
                    class="appt-confirm__close"
                    type="button"
                    title="Close"
                    onclick={handleCancelDelete}>&times;</button>
                <p class="appt-confirm__question">
                    Are you sure you want to delete this appointment?
                </p>
                <div class="appt-confirm__actions">
                    <c-ao-btn
                        label="Delete"
                        variant="danger"
                        onclick={handleConfirmDelete}>
                    </c-ao-btn>
                </div>
            </div>
        </div>
    </template>

    <!-- ── Loading overlay — root template, above every other surface ──────── -->
    <template lwc:if={isLoading}>
        <c-ao-spinner overlay size="medium" alternative-text="Loading appointments"></c-ao-spinner>
    </template>
</template>
